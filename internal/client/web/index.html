<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local Clipboard</title>
<style>
:root { color-scheme: light dark;
  --bg:#0d1117; --card:#171c24; --surface:#11161e; --fg:#edf2f7; --dim:#8d99aa;
  --acc:#6ea8fe; --acc-strong:#4f8cff; --acc-soft:rgba(79,140,255,.14);
  --ok:#46c47a; --ok-soft:rgba(70,196,122,.13); --err:#ef6a6a; --err-soft:rgba(239,106,106,.13);
  --line:#28303b; --input:#10151d; --shadow:0 16px 38px rgba(0,0,0,.18); }
@media (prefers-color-scheme: light) {
  :root { --bg:#f4f6f9; --card:#ffffff; --surface:#f7f9fc; --fg:#18202b; --dim:#748092;
    --acc:#3b78e7; --acc-strong:#2f6fe0; --acc-soft:#edf3ff;
    --ok:#1f9d58; --ok-soft:#eaf8f0; --err:#d84a4a; --err-soft:#fff0f0;
    --line:#e5eaf0; --input:#ffffff; --shadow:0 14px 34px rgba(31,42,55,.07); }
}
* { box-sizing:border-box; margin:0; padding:0; }
body { min-height:100vh; background:
  radial-gradient(circle at 50% -20%,var(--acc-soft),transparent 38%),var(--bg);
  color:var(--fg); font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;
  padding:30px 20px 64px; }
.shell { width:min(100%,920px); margin:0 auto; }
header { display:flex; align-items:center; min-height:48px; margin-bottom:18px; }
.brand { display:flex; align-items:center; gap:12px; min-width:0; }
.brand-icon { display:block; width:38px; height:38px; flex:0 0 auto; object-fit:cover; border:1px solid var(--line);
  border-radius:12px; box-shadow:0 8px 20px rgba(31,42,55,.14); }
.brand-copy { min-width:0; }
header h1 { font-size:19px; line-height:1.15; font-weight:680; letter-spacing:-.01em; }
.connection { display:flex; align-items:center; gap:6px; margin-top:4px; }
.locale-switch { display:flex; align-items:center; gap:5px; margin-left:auto; color:var(--dim); font-size:12px; }
.locale-switch button { background:none; color:var(--dim); padding:4px; font-size:12px; box-shadow:none; }
.locale-switch button:hover,.locale-switch button.active { color:var(--fg); }
.locale-switch button.active { font-weight:600; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--err); box-shadow:0 0 0 3px var(--err-soft); }
.dot.up { background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); }
.meta { color:var(--dim); font-size:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:15px; padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow); }
.card h2 { font-size:13px; line-height:1.3; color:var(--dim); font-weight:650; letter-spacing:.015em; margin-bottom:14px; }
.row { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
.row:first-of-type { border-top:none; }
.row .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sub { color:var(--dim); font-size:12px; }
.badge { display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; font-size:11px; font-weight:600;
  line-height:1.4; padding:3px 8px; border-radius:99px; background:var(--surface); color:var(--dim); }
.badge.done,.badge.received,.badge.applied { color:var(--ok); background:var(--ok-soft); }
.badge.failed { color:var(--err); background:var(--err-soft); }
.badge.sending,.badge.offered,.badge.receiving { color:var(--acc); background:var(--acc-soft); }
button { appearance:none; background:var(--acc-strong); color:#fff; border:1px solid transparent; border-radius:9px; padding:8px 15px;
  font:inherit; font-size:13px; font-weight:580; cursor:pointer; box-shadow:0 5px 14px rgba(47,111,224,.16); transition:transform .15s,filter .15s; }
button:hover { filter:brightness(1.06); }
button:active { transform:translateY(1px); }
button:disabled { opacity:.4; cursor:default; }
.pbar { height:4px; background:var(--line); border-radius:2px; overflow:hidden; flex:1; }
.pbar > div { height:100%; background:var(--acc); width:0; transition:width .2s; }
.empty { display:grid; place-items:center; min-height:76px; color:var(--dim); text-align:center; padding:18px;
  border:1px dashed var(--line); border-radius:11px; background:var(--surface); }
.sendbox { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
input[type=text] { flex:1 1 250px; min-width:210px; background:var(--input); border:1px solid var(--line); color:var(--fg);
  border-radius:9px; padding:8px 11px; font:inherit; font-size:13px; outline:none; transition:border-color .15s,box-shadow .15s; }
input[type=text]:focus { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft); }
label.filebtn { background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:8px 14px; cursor:pointer;
  font-size:13px; font-weight:580; transition:background .15s,border-color .15s; }
label.filebtn:hover { background:var(--acc-soft); border-color:var(--acc); }
label.filebtn input { display:none; }
.sendbox > .meta { flex:0 0 100%; padding-top:2px; }
.history-list { margin-top:-2px; }
.history-row { display:grid; grid-template-columns:72px 78px minmax(160px,1fr) 72px 104px; align-items:center; gap:12px;
  min-height:62px; padding:10px 2px; border-top:1px solid var(--line); }
.history-row:first-child { border-top:none; }
.event-time,.event-size { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
.event-size { text-align:right; }
.event-main { min-width:0; }
.event-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:590; }
.event-peer { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--dim); font-size:12px; margin-top:2px; }
.reveal-link { min-height:0; margin-top:5px; padding:0; color:var(--acc); background:none; border:0; box-shadow:none;
  font-size:11px; font-weight:600; }
.reveal-link:hover { filter:none; text-decoration:underline; }
.event-kind { justify-self:start; }
.event-state { justify-self:end; }
@media (max-width:680px) {
  body { padding:18px 12px 44px; }
  header { margin-bottom:14px; }
  .brand-icon { width:34px; height:34px; border-radius:10px; }
  .card { padding:16px; border-radius:13px; }
  .sendbox > button,.sendbox > label.filebtn { flex:1 1 calc(50% - 4px); text-align:center; }
  input[type=text] { flex-basis:100%; }
  .history-row { grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:
    "kind main state"
    "time main size"; gap:4px 10px; min-height:68px; }
  .event-time { grid-area:time; }
  .event-kind { grid-area:kind; }
  .event-main { grid-area:main; }
  .event-size { grid-area:size; }
  .event-state { grid-area:state; }
}
@media (max-width:420px) {
  header { align-items:flex-start; }
  .locale-switch { padding-top:4px; }
  .sendbox > button,.sendbox > label.filebtn { flex-basis:100%; }
  .history-row { grid-template-columns:auto minmax(0,1fr); grid-template-areas:
    "kind state"
    "main main"
    "time size"; }
  .event-state { justify-self:end; }
}
</style>
</head>
<body>
<main class="shell">
<header>
  <div class="brand">
    <img class="brand-icon" src="/app-icon.png" alt="" aria-hidden="true">
    <div class="brand-copy">
      <h1>Local Clipboard</h1>
      <div class="connection"><span class="dot" id="dot"></span><span class="meta" id="meta"></span></div>
    </div>
  </div>
  <nav class="locale-switch" data-i18n-aria-label="languageSwitcher">
    <button type="button" data-locale="zh" onclick="i18n.setLocale('zh')">中文</button>
    <span aria-hidden="true">/</span>
    <button type="button" data-locale="en" onclick="i18n.setLocale('en')">English</button>
  </nav>
</header>

<section class="card">
  <h2 data-i18n="sendToDevice"></h2>
  <div class="sendbox">
    <button type="button" onclick="sendClip()" data-i18n="sendClipboard"></button>
    <label class="filebtn"><span data-i18n="sendFiles"></span><input type="file" multiple onchange="sendFiles(this)"></label>
    <input type="text" id="to" data-i18n-placeholder="targetPlaceholder">
    <span class="meta" data-i18n="hotkeyHint"></span>
  </div>
</section>

<section class="card" id="pendingCard">
  <h2 style="display:flex;justify-content:space-between;align-items:center"><span data-i18n="pendingFiles"></span>
    <button type="button" id="acceptAllBtn" onclick="acceptAll()" style="display:none;padding:4px 12px;font-size:12px" data-i18n="receiveAll"></button>
  </h2>
  <div id="pending"></div>
</section>

<section class="card">
  <h2 data-i18n="transferHistory"></h2>
  <div id="events" class="history-list"></div>
</section>
</main>

<script src="/i18n.js"></script>
<script>
const $ = id => document.getElementById(id);
const i18n = window.LocalClipboardI18n;
const fmtSize = n => n>=1048576 ? (n/1048576).toFixed(1)+'MB' : n>=1024 ? Math.round(n/1024)+'KB' : n+'B';
const fmtTime = t => new Date(t).toLocaleTimeString(i18n.localeTag());
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const jsArg = value => JSON.stringify(String(value ?? '')).replace(/</g, '\\u003c');
let currentState = null;

function render(s){
    currentState = s;
    $('dot').className = 'dot' + (s.connected ? ' up' : '');
    $('meta').textContent = i18n.t(s.connected ? 'connected' : 'reconnecting');
    const pend = (s.events || []).filter(e => e.kind === 'file' && ['offered','sending','receiving'].includes(e.state));
    let ph = '';
    for (const e of pend) {
      ph += `<div class="row"><span class="badge">${escapeHTML(badgeText(e))}</span>
        <span class="grow">${escapeHTML(eventName(e, 'clipboard'))}<div class="sub">${escapeHTML(i18n.t('fromPeer', {peer:e.peer}))} · ${fmtSize(e.size)}</div></span>`;
      if (e.state==='offered') ph += `<button type="button" onclick="accept(${jsArg(e.fid)})">${escapeHTML(i18n.t('receive'))}</button>`;
      if (e.state==='sending'||e.state==='receiving') ph += `<div class="pbar"><div style="width:${e.pct||0}%"></div></div><span class="sub">${e.pct||0}%</span>`;
      ph += '</div>';
    }
    $('pending').innerHTML = ph || `<div class="empty">${i18n.t('noActiveTransfers')}</div>`;
    $('acceptAllBtn').style.display = (s.events || []).some(e => e.state === 'offered') ? '' : 'none';
    let eh = '';
    for (const e of (s.events || []).slice(0,30)) {
      const reveal = e.state === 'received' && e.fid && e.path
        ? `<button class="reveal-link" type="button" onclick="reveal(${jsArg(e.fid)})">${escapeHTML(i18n.t('showInFolder'))}</button>` : '';
      eh += `<div class="history-row"><time class="event-time">${escapeHTML(fmtTime(e.time))}</time>
        <span class="badge event-kind ${escapeHTML(e.state)}">${escapeHTML(directionText(e.dir))}·${escapeHTML(kindText(e.kind))}</span>
        <div class="event-main"><div class="event-name">${escapeHTML(eventName(e, 'clipboardContent'))}</div><div class="event-peer">${escapeHTML(e.peer)}</div>${reveal}</div>
        <span class="event-size">${fmtSize(e.size)}</span><span class="badge event-state ${escapeHTML(e.state)}">${escapeHTML(stateText(e))}</span></div>`;
    }
    $('events').innerHTML = eh || `<div class="empty">${i18n.t('noHistory')}</div>`;
}
async function refresh(){
  try {
    render(await (await fetch('/api/state')).json());
  } catch(e) {
    $('dot').className = 'dot';
    $('meta').textContent = i18n.t('consoleOffline');
  }
}
function eventName(e, fallbackKey){
  if (!e.name || e.name === `${e.kind} from clipboard`) return i18n.t(fallbackKey);
  return e.name;
}
function directionText(direction){
  return i18n.t(direction === 'in' ? 'directionIn' : 'directionOut');
}
function kindText(kind){
  const key = {text:'kindText', image:'kindImage', file:'kindFile'}[kind];
  return key ? i18n.t(key) : kind;
}
function badgeText(e){
  const key = {offered:'stateOffered', sending:'stateSending', receiving:'stateReceiving', failed:'stateFailed'}[e.state];
  return key ? i18n.t(key) : e.state;
}
function stateText(e){
  const key = {done:'stateDone', received:'stateReceived', failed:'stateFailed', sending:'stateSending', offered:'stateOffered', receiving:'stateReceiving', applied:'stateApplied'}[e.state];
  return key ? i18n.t(key) : e.state;
}
async function accept(fid){
  await fetch('/api/accept',{method:'POST',body:JSON.stringify({fid})});
}
async function acceptAll(){
  await fetch('/api/accept-all',{method:'POST'});
}
async function reveal(fid){
  const response = await fetch('/api/reveal',{method:'POST',body:JSON.stringify({fid})});
  if(!response.ok) alert(i18n.t('revealFailed'));
}
async function sendClip(){
  const to = $('to').value.trim();
  const r = await fetch('/api/send-clipboard',{method:'POST',body:JSON.stringify({to})});
  if(!r.ok) alert(await r.text());
}
async function sendFiles(input){
  const to = $('to').value.trim();
  for (const f of input.files) {
    const fd = new FormData();
    fd.append('file', f);
    fd.append('to', to);
    await fetch('/api/send-file',{method:'POST',body:fd});
  }
  input.value='';
}
i18n.onChange(() => currentState ? render(currentState) : refresh());
i18n.apply();
setInterval(refresh, 800);
refresh();
</script>
</body>
</html>
