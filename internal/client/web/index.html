<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local Clipboard</title>
<style>
:root { color-scheme: light dark;
  --bg:#0f1115; --card:#1a1d24; --fg:#e6e9ef; --dim:#8b93a3; --acc:#4f8cff; --ok:#3fb96f; --err:#e05555; --line:#262a33; --input:#12151b; }
@media (prefers-color-scheme: light) {
  :root { --bg:#f5f6f8; --card:#ffffff; --fg:#1c1f26; --dim:#6b7280; --acc:#2f6fe0; --ok:#1d9a52; --err:#d43f3f; --line:#e5e7eb; --input:#fff; }
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"PingFang SC","Segoe UI",sans-serif; padding:20px; max-width:860px; margin:0 auto; }
header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
header h1 { font-size:18px; font-weight:600; }
.locale-switch { display:flex; align-items:center; gap:5px; margin-left:auto; color:var(--dim); font-size:12px; }
.locale-switch button { background:none; color:var(--dim); padding:2px 3px; font-size:12px; }
.locale-switch button:hover,.locale-switch button.active { color:var(--fg); }
.locale-switch button.active { font-weight:600; }
.dot { width:10px; height:10px; border-radius:50%; background:var(--err); }
.dot.up { background:var(--ok); }
.meta { color:var(--dim); font-size:12px; }
.card { background:var(--card); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
.card h2 { font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
.row { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line); }
.row:first-of-type { border-top:none; }
.row .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sub { color:var(--dim); font-size:12px; }
.badge { font-size:11px; padding:2px 8px; border-radius:99px; background:var(--line); color:var(--dim); }
.badge.done,.badge.received { color:var(--ok); }
.badge.failed { color:var(--err); }
.badge.sending,.badge.offered,.badge.receiving { color:var(--acc); }
button { background:var(--acc); color:#fff; border:none; border-radius:7px; padding:6px 14px; font-size:13px; cursor:pointer; }
button:disabled { opacity:.4; cursor:default; }
.pbar { height:4px; background:var(--line); border-radius:2px; overflow:hidden; flex:1; }
.pbar > div { height:100%; background:var(--acc); width:0; transition:width .2s; }
.empty { color:var(--dim); text-align:center; padding:18px 0; }
.sendbox { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
input[type=text] { background:var(--input); border:1px solid #2a2f3a; color:var(--fg); border-radius:7px; padding:7px 10px; font-size:13px; width:160px; }
label.filebtn { background:var(--line); border-radius:7px; padding:7px 14px; cursor:pointer; font-size:13px; }
label.filebtn input { display:none; }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>Local Clipboard</h1>
  <span class="meta" id="meta"></span>
  <nav class="locale-switch" data-i18n-aria-label="languageSwitcher">
    <button type="button" data-locale="zh" onclick="i18n.setLocale('zh')">中文</button>
    <span aria-hidden="true">/</span>
    <button type="button" data-locale="en" onclick="i18n.setLocale('en')">English</button>
  </nav>
</header>

<div class="card">
  <h2 data-i18n="sendToDevice"></h2>
  <div class="sendbox">
    <button type="button" onclick="sendClip()" data-i18n="sendClipboard"></button>
    <label class="filebtn"><span data-i18n="sendFiles"></span><input type="file" multiple onchange="sendFiles(this)"></label>
    <input type="text" id="to" data-i18n-placeholder="targetPlaceholder">
    <span class="meta" data-i18n="hotkeyHint"></span>
  </div>
</div>

<div class="card" id="pendingCard">
  <h2 style="display:flex;justify-content:space-between;align-items:center"><span data-i18n="pendingFiles"></span>
    <button type="button" id="acceptAllBtn" onclick="acceptAll()" style="display:none;padding:4px 12px;font-size:12px" data-i18n="receiveAll"></button>
  </h2>
  <div id="pending"></div>
</div>

<div class="card">
  <h2 data-i18n="transferHistory"></h2>
  <div id="events"></div>
</div>

<script src="/i18n.js"></script>
<script>
const $ = id => document.getElementById(id);
const i18n = window.LocalClipboardI18n;
const fmtSize = n => n>=1048576 ? (n/1048576).toFixed(1)+'MB' : n>=1024 ? Math.round(n/1024)+'KB' : n+'B';
const fmtTime = t => new Date(t).toLocaleTimeString(i18n.localeTag());
let currentState = null;

function render(s){
    currentState = s;
    $('dot').className = 'dot' + (s.connected ? ' up' : '');
    $('meta').textContent = i18n.t(s.connected ? 'connected' : 'reconnecting');
    const pend = (s.events || []).filter(e => ['offered','sending','receiving','failed'].includes(e.state));
    let ph = '';
    for (const e of pend) {
      ph += `<div class="row"><span class="badge">${badgeText(e)}</span>
        <span class="grow">${eventName(e, 'clipboard')}<div class="sub">${i18n.t('fromPeer', {peer:e.peer})} · ${fmtSize(e.size)}</div></span>`;
      if (e.state==='offered') ph += `<button type="button" onclick="accept('${e.fid}')">${i18n.t('receive')}</button>`;
      if (e.state==='sending'||e.state==='receiving') ph += `<div class="pbar"><div style="width:${e.pct||0}%"></div></div><span class="sub">${e.pct||0}%</span>`;
      if (e.state==='failed') ph += `<button type="button" onclick="retry('${e.fid}')">${i18n.t('retry')}</button>`;
      ph += '</div>';
    }
    $('pending').innerHTML = ph || `<div class="empty">${i18n.t('noActiveTransfers')}</div>`;
    $('acceptAllBtn').style.display = (s.events || []).some(e => e.state === 'offered') ? '' : 'none';
    let eh = '';
    for (const e of (s.events || []).slice(0,30)) {
      eh += `<div class="row"><span class="sub" style="width:70px">${fmtTime(e.time)}</span>
        <span class="badge ${e.state}">${directionText(e.dir)}·${kindText(e.kind)}</span>
        <span class="grow">${eventName(e, 'clipboardContent')}<div class="sub">${e.peer}</div></span>
        <span class="sub">${fmtSize(e.size)}</span><span class="badge ${e.state}">${stateText(e)}</span></div>`;
    }
    $('events').innerHTML = eh || `<div class="empty">${i18n.t('noHistory')}</div>`;
}
async function refresh(){
  try {
    render(await (await fetch('/api/state')).json());
  } catch(e) {
    $('dot').className = 'dot';
    $('meta').textContent = i18n.t('consoleOffline');
  }
}
function eventName(e, fallbackKey){
  if (!e.name || e.name === `${e.kind} from clipboard`) return i18n.t(fallbackKey);
  return e.name;
}
function directionText(direction){
  return i18n.t(direction === 'in' ? 'directionIn' : 'directionOut');
}
function kindText(kind){
  const key = {text:'kindText', image:'kindImage', file:'kindFile'}[kind];
  return key ? i18n.t(key) : kind;
}
function badgeText(e){
  const key = {offered:'stateOffered', sending:'stateSending', receiving:'stateReceiving', failed:'stateFailed'}[e.state];
  return key ? i18n.t(key) : e.state;
}
function stateText(e){
  const key = {done:'stateDone', received:'stateReceived', failed:'stateFailed', sending:'stateSending', offered:'stateOffered', receiving:'stateReceiving'}[e.state];
  return key ? i18n.t(key) : e.state;
}
async function accept(fid){
  await fetch('/api/accept',{method:'POST',body:JSON.stringify({fid})});
}
async function acceptAll(){
  await fetch('/api/accept-all',{method:'POST'});
}
async function sendClip(){
  const to = $('to').value.trim();
  const r = await fetch('/api/send-clipboard',{method:'POST',body:JSON.stringify({to})});
  if(!r.ok) alert(await r.text());
}
async function sendFiles(input){
  const to = $('to').value.trim();
  for (const f of input.files) {
    const fd = new FormData();
    fd.append('file', f);
    fd.append('to', to);
    await fetch('/api/send-file',{method:'POST',body:fd});
  }
  input.value='';
}
i18n.onChange(() => currentState ? render(currentState) : refresh());
i18n.apply();
setInterval(refresh, 800);
refresh();
</script>
</body>
</html>
